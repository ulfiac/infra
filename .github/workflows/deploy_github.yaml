name: deploy github
run-name: "${{ inputs.terragrunt_action }}: github, ${{ inputs.github_repo }}"

on:
  workflow_dispatch:
    inputs:
      github_repo:
        default: all
        options:
          - all
          - test-repo-burrito
          - test-repo-guacamole
        required: true
        type: choice
      terragrunt_action:
        default: plan
        options:
          - plan
          - plan destroy
          - apply
          - destroy
        required: true
        type: choice
      dump_github_context:
        default: false
        required: false
        type: boolean
      skip_approval:
        default: false
        required: false
        type: boolean
      terragrunt_parallelism:
        default: true
        required: false
        type: boolean
      terragrunt_strict_mode:
        default: true
        required: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  set-plan-action:
    name: set plan action
    runs-on: ubuntu-24.04
    outputs:
      plan_action: ${{ steps.set-plan-action.outputs.plan_action }}
    steps:
      - name: set plan action
        id: set-plan-action
        run: |
          case "${{ inputs.terragrunt_action }}" in
            "plan")         echo "plan_action=plan"         >> "$GITHUB_OUTPUT";;
            "apply")        echo "plan_action=plan"         >> "$GITHUB_OUTPUT";;
            "plan destroy") echo "plan_action=plan destroy" >> "$GITHUB_OUTPUT";;
            "destroy")      echo "plan_action=plan destroy" >> "$GITHUB_OUTPUT";;
            *)              echo "Unexpected terragrunt_action: ${{ inputs.terragrunt_action }}"; exit 1;;
          esac

  plan:
    uses: ./.github/workflows/reusable_terragrunt_action.yaml
    needs: set-plan-action
    with:
      aws_region: us-east-2
      dump_github_context: ${{ inputs.dump_github_context }}
      github_environment: github
      terragrunt_action: ${{ needs.set-plan-action.outputs.plan_action }}
      terragrunt_parallelism: ${{ inputs.terragrunt_parallelism }}
      terragrunt_queue_include_dir: ${{ inputs.github_repo == 'all' && './**' || format('./{0}', inputs.github_repo) }}
      terragrunt_strict_mode: ${{ inputs.terragrunt_strict_mode }}
      working_dir: './github/repo'
    secrets: inherit

  get-approval:
    name: get approval
    runs-on: ubuntu-24.04
    if: ${{ inputs.terragrunt_action == 'apply' || inputs.terragrunt_action == 'destroy' }}
    environment: ${{ inputs.skip_approval == true && 'approval_skipped' || 'approval_required' }}
    needs: plan
    steps:
      - name: approval requested
        run: echo 'Approval provided. Job will continue.'

  apply:
    uses: ./.github/workflows/reusable_terragrunt_action.yaml
    if: ${{ inputs.terragrunt_action == 'apply' || inputs.terragrunt_action == 'destroy' }}
    needs: get-approval
    with:
      aws_region: us-east-2
      dump_github_context: ${{ inputs.dump_github_context }}
      github_environment: github
      terragrunt_action: ${{ inputs.terragrunt_action }}
      terragrunt_parallelism: ${{ inputs.terragrunt_parallelism }}
      terragrunt_queue_include_dir: ${{ inputs.github_repo == 'all' && './**' || format('./{0}', inputs.github_repo) }}
      terragrunt_strict_mode: ${{ inputs.terragrunt_strict_mode }}
      working_dir: './github/repo'
    secrets: inherit
