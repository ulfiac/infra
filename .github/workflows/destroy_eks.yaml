name: destroy eks
run-name: "destroy: aws, all, all, eks_vpc"

on:
  schedule:
    - cron: "41 3 * * *" # every day at 0341 UTC (10:41pm EST, 11:41pm EDT)
  workflow_dispatch:

concurrency:
  group: destroy-eks
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  destroy_eks:
    name: destroy eks
    uses: ./.github/workflows/reusable_deploy_aws_accounts.yaml
    with:
      aws_account: all
      aws_region: all
      component: eks_vpc
      terragrunt_action: destroy
    secrets: inherit
