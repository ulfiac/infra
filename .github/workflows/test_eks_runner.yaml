name: test eks runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-eks-runner:
    runs-on: codebuild-eks-runner-infra-us-east-2-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pwd
      - run: terraform --version
      - run: terragrunt --version
      - run: aws --version
      - run: ls -la
      - name: test
        run: |
          echo "Running inside AWS CodeBuild!"
          aws sts get-caller-identity
