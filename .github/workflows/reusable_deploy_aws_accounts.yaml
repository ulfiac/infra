name: reusable deploy aws accounts
run-name: "${{ inputs.terragrunt_action }}: aws, ${{ inputs.aws_account }}, ${{ inputs.aws_region }}, ${{ inputs.component }}"

on:
  workflow_call:
    inputs:
      aws_account:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      component:
        required: true
        type: string
      dump_github_context:
        default: false
        required: false
        type: boolean
      terragrunt_action:
        required: true
        type: string
      terragrunt_parallelism:
        default: true
        required: false
        type: boolean
      terragrunt_strict_mode:
        default: true
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      aws_account:
        default: all
        options:
          - all
          - mgmt
        required: true
        type: choice
      aws_region:
        default: all
        options:
          - all
          - _global
          - ca-central-1
          - us-east-1
          - us-east-2
        required: true
        type: choice
      component:
        default: all
        required: true
        type: string
      dump_github_context:
        default: false
        required: false
        type: boolean
      terragrunt_action:
        default: plan
        options:
          - plan
          - plan destroy
          - apply
          - destroy
        required: true
        type: choice
      terragrunt_parallelism:
        default: true
        required: false
        type: boolean
      terragrunt_strict_mode:
        default: true
        required: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  setup-matrix:
    name: setup account matrix
    runs-on: ubuntu-24.04
    outputs:
      accounts: ${{ steps.set-accounts.outputs.accounts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: set-accounts
        env:
          AWS_ACCOUNT_INPUT: ${{ inputs.aws_account }}
        run: |
          set -euo pipefail
          if [ "$AWS_ACCOUNT_INPUT" = "all" ]; then
            accounts="$(find "terragrunt/aws" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -R . | jq -sc .)"
          else
            accounts="$(jq -cn --arg a "$AWS_ACCOUNT_INPUT" '[$a]')"
          fi
          echo "accounts=$accounts" >> "$GITHUB_OUTPUT"

  deploy-aws-accounts:
    name: ${{ matrix.aws_account }}
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        aws_account: ${{ fromJson(needs.setup-matrix.outputs.accounts) }}
    uses: ./.github/workflows/reusable_deploy_aws_regions.yaml
    with:
      aws_account: ${{ matrix.aws_account }}
      aws_region: ${{ inputs.aws_region }}
      component: ${{ inputs.component }}
      dump_github_context: ${{ inputs.dump_github_context }}
      terragrunt_action: ${{ inputs.terragrunt_action }}
      terragrunt_parallelism: ${{ inputs.terragrunt_parallelism }}
      terragrunt_strict_mode: ${{ inputs.terragrunt_strict_mode }}
    secrets: inherit
