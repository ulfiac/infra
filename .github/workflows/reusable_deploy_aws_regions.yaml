name: reusable deploy aws regions
run-name: "${{ inputs.terragrunt_action }}: aws, ${{ inputs.aws_account }}, ${{ inputs.aws_region }}, ${{ inputs.component }}"

on:
  workflow_call:
    inputs:
      aws_account:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      component:
        required: true
        type: string
      dump_github_context:
        default: false
        required: false
        type: boolean
      terragrunt_action:
        required: true
        type: string
      terragrunt_parallelism:
        default: true
        required: false
        type: boolean
      terragrunt_strict_mode:
        default: true
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      aws_account:
        default: mgmt
        options:
          - mgmt
        required: true
        type: choice
      aws_region:
        default: all
        options:
          - all
          - _global
          - ca-central-1
          - us-east-1
          - us-east-2
        required: true
        type: choice
      component:
        default: all
        required: true
        type: string
      dump_github_context:
        default: false
        required: false
        type: boolean
      terragrunt_action:
        default: plan
        options:
          - plan
          - plan destroy
          - apply
          - destroy
        required: true
        type: choice
      terragrunt_parallelism:
        default: true
        required: false
        type: boolean
      terragrunt_strict_mode:
        default: true
        required: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  setup-matrix:
    name: "setup region matrix (${{ inputs.aws_account }})"
    runs-on: ubuntu-24.04
    outputs:
      regions: ${{ steps.set-regions.outputs.regions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: set-regions
        env:
          AWS_ACCOUNT_INPUT: ${{ inputs.aws_account }}
          AWS_REGION_INPUT: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          if [ "$AWS_REGION_INPUT" = "all" ]; then
            regions="$(find "terragrunt/aws/$AWS_ACCOUNT_INPUT" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | jq -R . | jq -sc .)"
          else
            regions="$(jq -cn --arg r "$AWS_REGION_INPUT" '[$r]')"
          fi
          echo "regions=$regions" >> "$GITHUB_OUTPUT"

  deploy-aws-regions:
    name: ${{ matrix.aws_region }}
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        aws_region: ${{ fromJson(needs.setup-matrix.outputs.regions) }}
    uses: ./.github/workflows/reusable_terragrunt_action.yaml
    with:
      aws_region: ${{ matrix.aws_region }}
      dump_github_context: ${{ inputs.dump_github_context }}
      github_environment: aws_${{ inputs.aws_account }}
      terragrunt_action: ${{ inputs.terragrunt_action }}
      terragrunt_parallelism: ${{ inputs.terragrunt_parallelism }}
      terragrunt_queue_include_dir: ${{ inputs.component == 'all' && './**' || format('./{0}', inputs.component) }}
      terragrunt_strict_mode: ${{ inputs.terragrunt_strict_mode }}
      working_dir: "./aws/${{ inputs.aws_account }}/${{ matrix.aws_region }}"
    secrets: inherit
