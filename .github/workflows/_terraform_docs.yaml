name: _terraform-docs
run-name: "terraform-docs: ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/modules/**'
      - '!terraform/modules/**/README.md'
  workflow_dispatch: {}

permissions: {}

jobs:
  terraform-docs:
    uses: ulfiac/commons/.github/workflows/reusable_terraform_docs.yaml@86f71e53e74747e558b50cb51c469bd371c045bf # v1.0.51
    secrets:
      APP_CLIENT_ID: ${{ secrets.TERRAFORM_DOCS_BOT_APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.TERRAFORM_DOCS_BOT_APP_PRIVATE_KEY }}
